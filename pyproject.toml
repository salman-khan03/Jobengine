[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobengine"
version = "2.0.0"
description = "RoleRadar: evidence-grounded job intelligence. Sponsor-aware ingest (JobEngine) plus a cited resume-to-requirement decision engine with outcome-based ranking evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Salman Aziz Khan" }]
# SQLAlchemy gives one portable DB layer (SQLite for local dev/tests, Postgres
# in prod via DATABASE_URL) instead of two hand-written codepaths.
dependencies = [
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "bcrypt>=4.0",
    "pyjwt>=2.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8", "ruff>=0.4", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
jobengine = "jobengine.cli:main"
roleradar = "roleradar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
